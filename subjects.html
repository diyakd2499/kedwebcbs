<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المواد | كلية تقنية المعلومات</title>

 <style>
    :root {
      --primary: #0d3b66;
      --secondary: #1e6091;
      --accent: #3a86ff;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s ease;
    }

    body {
      margin: 0;
      background: var(--bg-light);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* ===== Dark Mode ===== */
    body.dark {
      --bg-light: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
    }

    /* ===== Header ===== */
    .main-header {
      background: #0d3b66;
      color: white;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 45px;
      height: 45px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .header-title strong { font-size: 16px; display: block; }
    .header-title small { font-size: 12px; opacity: 0.8; }

    .header-actions { display: flex; gap: 10px; }

    .btn-action {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action:hover {
      background: white;
      color: #0d3b66;
      transform: translateY(-2px);
    }

    /* ===== Content ===== */
    .container {
      padding: 40px 5%;
      max-width: 1200px;
      margin: auto;
    }

    .page-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ===== Subjects Grid ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    /* ===== Modern Subject Card ===== */
    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.02);
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* شريط جانبي ملون */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      background: var(--accent);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 30px rgba(0,0,0,0.1);
      border-color: var(--accent);
    }

    .card h4 {
      margin: 0 0 10px 0;
      color: var(--text-main);
      font-size: 20px;
      font-weight: 700;
    }

    .level-tag {
      display: inline-block;
      background: rgba(58, 134, 255, 0.1);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 15px;
      width: fit-content;
    }

    .doctor-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-muted);
      border-top: 1px solid rgba(0,0,0,0.05);
      padding-top: 15px;
      margin-top: auto;
    }
    body.dark .doctor-info { border-color: rgba(255,255,255,0.05); }

    .arrow-icon {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 32px;
      height: 32px;
      background: var(--bg-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: bold;
    }

    .card:hover .arrow-icon {
      background: var(--accent);
      color: white;
      transform: rotate(-45deg);
    }

    /* Error Message */
    #errorMessage {
      background: #fee2e2;
      color: #dc2626;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #fecaca;
      font-weight: 600;
      text-align: center;
    }

    .main-footer {
      margin-top: 50px;
      padding: 30px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.02);
    }

    @media (max-width: 600px) {
      .container { padding: 25px 15px; }
      .grid { grid-template-columns: 1fr; }
      .page-title { font-size: 22px; }
    }
  </style>
</head>

<body>

<!-- ===== Header ===== -->
<header class="main-header">
  <div class="header-left">
    <img src="assets/logo.png" class="logo">
    <div class="header-title">
      <strong>كلية تقنية المعلومات</strong><br>
      <small>جامعة النصر التقنية</small>
    </div>
  </div>

  <button class="back-btn" onclick="history.back()">⬅ رجوع</button>
    <button class="btn" onclick="toggleDark()">🌙</button>
</header>

<!-- ===== Content ===== -->
<div class="container">
  <div class="page-title">📚 المواد الدراسية</div>
  <div id="errorMessage" style="display:none; color:red; margin-bottom:20px; padding:10px; background:#fee; border-radius:8px;"></div>
  <div class="grid" id="subjects"></div>
</div>

<script>
  const token = localStorage.getItem("token");
  if (!token) location.href = "login.html";

  // إعداد عنوان الخادم الأساسي
  //const API_BASE_URL = "http://localhost:5000";

  async function loadSubjects() {
    try {
      const res = await fetch(`/api/subjects`, {
        headers: {
          Authorization: "Bearer " + token
        }
      });

      if (!res.ok) throw new Error("فشل في جلب المواد من الخادم");

      const data = await res.json();
      const container = document.getElementById("subjects");

      if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = "<p class='empty'>لا توجد مواد متاحة حالياً</p>";
        return;
      }

      container.innerHTML = "";
      data.forEach(sub => {
        // نستخدم _id أو id لضمان الحصول على المعرف الصحيح من MongoDB
        const subjectId = sub._id || sub.id;
        
        container.innerHTML += `
          <div class="card" onclick="openSubject('${subjectId}')">
            <h4>${sub.name}</h4>
            <p>${sub.level}</p>
            <div class="doctor">👨‍🏫 ${sub.doctor?.name || "غير محدد"}</div>
            <div class="arrow">➜</div>
          </div>
        `;
      });
    } catch (err) {
      console.error("Error loading subjects:", err);
      const errorEl = document.getElementById("errorMessage");
      errorEl.innerText = "خطأ في الاتصال بالخادم. تأكد من تشغيل الـ Backend.";
      errorEl.style.display = "block";
    }
  }

  function openSubject(id) {
    if (!id || id === "undefined" || id === "null") {
      alert("خطأ: معرف المادة غير صالح. يرجى تحديث الصفحة.");
      return;
    }
    window.location.href = "subject.html?id=" + id;
  }
  

  loadSubjects();
  
   /* ===== Dark Mode ===== */
  function toggleDark() {
    document.body.classList.toggle("dark");
    localStorage.setItem(
      "darkMode",
      document.body.classList.contains("dark")
    );
  }

  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
  }
</script>

<footer class="main-footer">
  إنشاء: <strong>ضياء الدين إبراهيم</strong> —  
  حقوق النشر © <span id="year"></span> جامعة النصر التقنية
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();
</script>

</body>
</html>
