<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التنبيهات | كلية تقنية المعلومات</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      /* Palette - Modern Blue & Clean Grays */
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
      /* Accents */
      --accent-danger: #ef4444;
      --accent-danger-bg: #fef2f2;
      --accent-success: #10b981;
      
      /* Effects */
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    /* ===== Dark Mode Variables ===== */
    body.dark {
      --primary: #60a5fa;
      --primary-dark: #3b82f6;
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-danger-bg: rgba(239, 68, 68, 0.1);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s; }
    
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    .main-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 0;
    }
    
    body.dark .main-header {
      background: rgba(30, 41, 59, 0.85);
    }

    .header-content {
      max-width: 800px; /* جعل المحتوى مركزي */
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand-text h1 {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
      color: var(--text-main);
    }
    
    .brand-text span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .icon-btn:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    /* ===== Main Layout ===== */
    .container {
      max-width: 800px; /* عرض مثالي للقراءة */
      margin: 0 auto;
      padding: 2rem 1.5rem;
      width: 100%;
      flex: 1;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 2rem;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }
    
    .page-title i { color: var(--primary); }

    .btn-text {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 8px;
    }
    
    .btn-text:hover { background: rgba(37, 99, 235, 0.1); }

    /* ===== Notification Cards ===== */
    #notes {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      position: relative;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      cursor: default;
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .note-card.interactive { cursor: pointer; }
    .note-card.interactive:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    /* Unread Indicator */
    .unread-indicator {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem; /* وضع النقطة في اليسار */
      width: 10px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--bg-card);
    }
    
    .note-card.emergency .unread-indicator { background-color: var(--accent-danger); }

    /* Header inside card */
    .note-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .note-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      padding-left: 15px; /* مساحة للنقطة الحمراء */
    }

    .note-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    
    .note-body {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Emergency Style */
    .note-card.emergency {
      background-color: var(--accent-danger-bg);
      border-color: rgba(239, 68, 68, 0.3);
    }
    
    .note-card.emergency .note-title {
      color: var(--accent-danger);
    }

    .emergency-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-danger);
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.2;
      display: block;
    }

    /* ===== Footer ===== */
    .main-footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
    }

    /* Mobile Tweaks */
    @media (max-width: 600px) {
      .container { padding: 1.5rem 1rem; }
      .page-title { font-size: 1.5rem; }
      .note-card { padding: 1rem; }
      .header-content { padding: 0 1rem; }
      .brand-text h1 { font-size: 0.9rem; }
      .brand-text span { display: none; } /* تبسيط الشعار في الموبايل */
    }
  </style>
</head>

<body>

<header class="main-header">
  <div class="header-content">
    <div class="brand">
      <img src="assets/logo.png" class="logo" alt="Logo">
      <div class="brand-text">
        <h1>كلية تقنية المعلومات</h1>
        <span>جامعة النصر التقنية</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="toggleDark()" title="الوضع الليلي">
        <i class="ri-moon-line" id="themeIcon"></i>
      </button>
      <button class="icon-btn" onclick="history.back()" title="رجوع">
        <i class="ri-arrow-left-line"></i>
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div class="page-head">
    <h2 class="page-title"><i class="ri-notification-3-fill"></i> التنبيهات</h2>
    <button class="btn-text" id="readAllBtn" onclick="markAllAsRead()" style="display:none;">
      <i class="ri-check-double-line"></i> تحديد الكل كمقروء
    </button>
  </div>
  
  <div id="notes">
    </div>
</div>

<footer class="main-footer">
  <div>حقوق النشر © <span id="year"></span> جامعة النصر التقنية</div>
  <div style="margin-top: 5px; opacity: 0.6; font-size: 0.75rem;">تطوير: ضياء الدين إبراهيم</div>
</footer>

<script>
  // تحديث السنة
  document.getElementById("year").innerText = new Date().getFullYear();

  const token = localStorage.getItem("token");
  const user = JSON.parse(localStorage.getItem("user") || "{}");

  // التحقق من تسجيل الدخول
  if (!token) {
    window.location.href = "login.html";
  }

  // دالة جلب التنبيهات (Backend Logic لم يتم المساس به)
  async function loadNotifications() {
    try {
      const res = await fetch("/api/notifications", {
        headers: { Authorization: "Bearer " + token }
      });

      const data = await res.json();
      const container = document.getElementById("notes");
      const readAllBtn = document.getElementById("readAllBtn");

      if (data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="ri-notification-off-line"></i>
            <p>لا توجد تنبيهات جديدة حالياً</p>
          </div>`;
        readAllBtn.style.display = "none";
        return;
      }

      const unreadExists = data.some(n => !n.readBy || !n.readBy.includes(user._id));
      readAllBtn.style.display = unreadExists ? "inline-flex" : "none";

      // توليد HTML الحديث للبطاقات
      container.innerHTML = data.map(n => {
        const isUnread = !n.readBy || !n.readBy.includes(user._id);
        const isEmergency = n.type === "emergency";
        
        // تنسيق التاريخ ليكون أكثر احترافية
        const dateObj = new Date(n.createdAt);
        const dateStr = dateObj.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
        const timeStr = dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="note-card ${isEmergency ? 'emergency' : ''} ${isUnread ? 'interactive' : ''}" 
               id="note-${n._id}" 
               onclick="${isUnread ? `markAsRead('${n._id}')` : ''}">
            
            ${isUnread ? '<div class="unread-indicator"></div>' : ''}
            
            <div class="note-content">
              ${isEmergency ? '<div class="emergency-badge"><i class="ri-alarm-warning-fill"></i> هام وعاجل</div>' : ''}
              
              <h3 class="note-title">${n.title}</h3>
              
              <div class="note-meta">
                <i class="ri-time-line"></i>
                <span>${dateStr} • ${timeStr}</span>
              </div>
              
              <div class="note-body" style="margin-top: 10px;">
                ${n.message}
              </div>
            </div>
          </div>
        `;
      }).join("");

      localStorage.setItem("lastNotifCheck", Date.now());
    } catch (err) {
      console.error("Error loading notifications:", err);
      // Fallback in case of error
      document.getElementById("notes").innerHTML = `<div class="empty-state">حدث خطأ في تحميل التنبيهات</div>`;
    }
  }

  // دالة تحديد كـ مقروء (Backend Logic لم يتم المساس به)
  async function markAsRead(id) {
    try {
      const res = await fetch(`/api/notifications/read/${id}`, {
        method: "POST",
        headers: { Authorization: "Bearer " + token }
      });
      
      if (res.ok) {
        const noteEl = document.getElementById(`note-${id}`);
        // إزالة مؤشر غير المقروء وتحديث الستايل
        const indicator = noteEl.querySelector(".unread-indicator");
        if(indicator) indicator.remove();
        
        noteEl.classList.remove("interactive");
        noteEl.onclick = null;
        
        // التحقق مما إذا بقي أي تنبيه غير مقروء لإخفاء زر "الكل"
        const remainingUnread = document.querySelectorAll(".unread-indicator");
        if (remainingUnread.length === 0) {
          document.getElementById("readAllBtn").style.display = "none";
        }
      }
    } catch (err) {
      console.error("Error marking as read:", err);
    }
  }

  // دالة تحديد الكل كمقروء (Backend Logic لم يتم المساس به)
  async function markAllAsRead() {
    try {
      const res = await fetch("/api/notifications/read-all", {
        method: "POST",
        headers: { Authorization: "Bearer " + token }
      });
      
      if (res.ok) {
        loadNotifications();
      }
    } catch (err) {
      console.error("Error marking all as read:", err);
    }
  }

  loadNotifications();

  /* ===== Dark Mode Logic ===== */
  function toggleDark() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("darkMode", isDark);
    updateThemeIcon(isDark);
  }

  function updateThemeIcon(isDark) {
    const icon = document.getElementById("themeIcon");
    if(isDark) {
      icon.className = "ri-sun-line";
    } else {
      icon.className = "ri-moon-line";
    }
  }

  // Initialize Theme
  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
    updateThemeIcon(true);
  }
</script>

</body>
</html>
