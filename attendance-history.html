<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجلات الحضور السابقة | كلية تقنية المعلومات</title>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: #f4f6f8; min-height: 100vh; transition: 0.3s; }
    body.dark { background: #121212; color: #e0e0e0; }

    .main-header {
      background: #0d3b66; color: white; padding: 15px 30px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .logo { width: 50px; height: 50px; }
    .back-btn { background: white; color: #0d3b66; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }

    .container { padding: 30px; max-width: 1000px; margin: auto; }
    .page-title { font-size: 22px; font-weight: 600; color: #0d3b66; margin-bottom: 25px; }
    body.dark .page-title { color: #90caf9; }

    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .history-card {
      background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      cursor: pointer; transition: 0.3s; border-right: 5px solid #0d3b66;
    }
    body.dark .history-card { background: #1e1e1e; }
    .history-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    
    .card-date { font-size: 12px; color: #888; font-weight: bold; }
    .card-subject { font-size: 18px; font-weight: 600; color: #0d3b66; margin: 8px 0; }
    body.dark .card-subject { color: #90caf9; }
    .card-stats { font-size: 14px; color: #666; }

    /* Modal for details */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    .modal-content { background: white; margin: 5% auto; padding: 30px; border-radius: 16px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
    body.dark .modal-content { background: #1e1e1e; }
    
    .student-list-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    body.dark .student-list-item { border-bottom-color: #333; }
    .status-badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; }
    .status-present { background: #d4edda; color: #155724; }
    .status-absent { background: #f8d7da; color: #721c24; }

    /* تنسيق أزرار المودال الجديدة */
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-action { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-close { background: #d9534f; color: white; }
    .btn-download { background: #28a745; color: white; }
  </style>
</head>
<body>

<header class="main-header">
  <div class="header-left">
    <img src="assets/logo.png" class="logo">
    <div class="header-title">
      <strong>كلية تقنية المعلومات</strong><br>
      <small>جامعة النصر التقنية</small>
    </div>
  </div>
  <button class="back-btn" onclick="history.back()">⬅ رجوع</button>
</header>

<div class="container">
  <h2 class="page-title">📜 سجلات الحضور التاريخية</h2>
  <div id="historyGrid" class="history-grid">
    </div>
</div>

<div id="detailsModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-top:0; color:#0d3b66;">تفاصيل الحضور</h3>
    <div id="studentList"></div>
    
    <div class="modal-actions">
        <button onclick="downloadPDF()" class="btn-action btn-download">📄 تحميل PDF</button>
        <button onclick="closeModal()" class="btn-action btn-close">إغلاق</button>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem("token");
  if (!token) location.href = "login.html";

  // متغير لتخزين بيانات السجل الحالي للطباعة
  let currentAttendanceData = null;

  async function loadHistory() {
    try {
      const res = await fetch("/api/attendance/history", {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await res.json();
      const grid = document.getElementById("historyGrid");
      
      if (data.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#999;">لا توجد سجلات سابقة</p>';
        return;
      }

      grid.innerHTML = data.map(h => {
        const presentCount = h.students.filter(s => s.status === 'present').length;
        return `
          <div class="history-card" onclick="viewDetails('${h._id}')">
            <div class="card-date">📅 ${h.date}</div>
            <div class="card-subject">${h.subject.name}</div>
            <div class="card-stats">✅ حاضر: ${presentCount} | ❌ غائب: ${h.students.length - presentCount}</div>
          </div>
        `;
      }).join("");
    } catch (err) { console.error(err); }
  }

  async function viewDetails(id) {
    try {
      const res = await fetch(`/api/attendance/${id}`, {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await res.json();
      
      currentAttendanceData = data; // حفظ البيانات للطباعة

      document.getElementById("modalTitle").innerText = `حضور مادة: ${data.subject.name} (${data.date})`;
      const list = document.getElementById("studentList");
      list.innerHTML = data.students.map(s => `
        <div class="student-list-item">
          <span>${s.student.name}</span>
          <span class="status-badge ${s.status === 'present' ? 'status-present' : 'status-absent'}">
            ${s.status === 'present' ? 'حاضر' : 'غائب'}
          </span>
        </div>
      `).join("");
      
      document.getElementById("detailsModal").style.display = "block";
    } catch (err) { console.error(err); }
  }

  // --- دالة تحميل PDF الجديدة ---
  function downloadPDF() {
    if (!currentAttendanceData) return;

    // إنشاء محتوى مخصص للطباعة
    const printContent = document.createElement('div');
    printContent.style.direction = 'rtl';
    printContent.style.fontFamily = 'Segoe UI, Tahoma, sans-serif';
    printContent.style.padding = '20px';
    
    // تصميم المحتوى: التاريخ كبير جداً، واسم المادة، والقائمة
    printContent.innerHTML = `
        <div style="text-align: center; margin-bottom: 30px; border-bottom: 2px solid #0d3b66; padding-bottom: 20px;">
            <h1 style="font-size: 50px; color: #0d3b66; margin: 0; font-weight: bold;">${currentAttendanceData.date}</h1>
            <h2 style="font-size: 24px; color: #555; margin: 10px 0;">سجل حضور: ${currentAttendanceData.subject.name}</h2>
            <p>كلية تقنية المعلومات - جامعة النصر التقنية</p>
        </div>
        <div style="font-size: 16px;">
            ${document.getElementById("studentList").innerHTML}
        </div>
        <div style="margin-top: 30px; text-align: left; font-size: 12px; color: #888;">
           تم الاستخراج بواسطة النظام الأكاديمي
        </div>
    `;

    // إعدادات الملف
    const opt = {
      margin:       10,
      filename:     `Attendance_${currentAttendanceData.date}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    // التحويل والحفظ
    html2pdf().set(opt).from(printContent).save().then(() => {
        Swal.fire('تم التحميل', 'تم حفظ ملف الحضور بنجاح', 'success');
    });
  }

  function closeModal() { document.getElementById("detailsModal").style.display = "none"; }
  window.onclick = (e) => { if (e.target == document.getElementById("detailsModal")) closeModal(); }

  loadHistory();
  if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
</script>
</body>
</html>
