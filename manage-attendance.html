<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل حضور الطلاب | كلية تقنية المعلومات</title>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
    body { margin: 0; background: #f4f6f8; min-height: 100vh; transition: 0.3s; direction: rtl; }
    body.dark { background: #121212; color: #e0e0e0; }

    .main-header {
      background: #0d3b66; color: white; padding: 15px 30px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .logo { width: 50px; height: 50px; }
    .back-btn { background: white; color: #0d3b66; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }

    .container { padding: 30px; max-width: 1000px; margin: auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; font-weight: 600; color: #0d3b66; margin: 0; }
    body.dark .page-title { color: #90caf9; }

    .setup-card {
      background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;
    }
    body.dark .setup-card { background: #1e1e1e; }
    .form-group { flex: 1; min-width: 200px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    .form-group select, .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; outline: none; }
    body.dark .form-group select, body.dark .form-group input { background: #2a2a2a; color: white; border-color: #444; }

    .attendance-list { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
    body.dark .attendance-list { background: #1e1e1e; }
    
    .student-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 25px; border-bottom: 1px solid #eee; transition: 0.3s;
    }
    body.dark .student-row { border-bottom-color: #333; }
    .student-row:last-child { border-bottom: none; }
    
    .student-info { display: flex; flex-direction: column; gap: 4px; }
    .student-name { font-weight: 600; color: #333; }
    body.dark .student-name { color: #e0e0e0; }
    .student-email { font-size: 12px; color: #888; }

    .attendance-actions { display: flex; gap: 10px; }
    .btn-status {
      padding: 8px 20px; border: 2px solid #ddd; border-radius: 20px;
      cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; background: white;
    }
    
    .btn-present:hover, .btn-present.active { background: #28a745; color: white; border-color: #28a745; }
    .btn-absent:hover, .btn-absent.active { background: #dc3545; color: white; border-color: #dc3545; }
    
    .row-present { background: #f0fff4; }
    body.dark .row-present { background: #142d1b; }
    .row-absent { background: #fff5f5; }
    body.dark .row-absent { background: #2d1414; }

    .footer-actions { margin-top: 30px; display: flex; justify-content: center; }
    .btn-save-all {
      background: #0d3b66; color: white; border: none; padding: 15px 40px;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 16px;
      box-shadow: 0 4px 15px rgba(13, 59, 102, 0.3); transition: 0.3s;
    }
    .btn-save-all:hover { background: #092b4c; transform: translateY(-2px); }

    .history-link { color: #0d3b66; text-decoration: none; font-weight: 600; font-size: 14px; }
    body.dark .history-link { color: #90caf9; }

    @media (max-width: 600px) {
      .student-row { flex-direction: column; gap: 15px; align-items: flex-start; }
      .attendance-actions { width: 100%; }
      .btn-status { flex: 1; }
    }
  </style>
</head>
<body>

<header class="main-header">
  <div class="header-left">
    <img src="assets/logo.png" class="logo" alt="شعار الكلية">
    <div class="header-title">
      <strong>كلية تقنية المعلومات</strong><br>
      <small>جامعة النصر التقنية</small>
    </div>
  </div>
  <button class="back-btn" onclick="history.back()">⬅ رجوع</button>
</header>

<div class="container">
  <div class="page-header">
    <h2 class="page-title">📝 تسجيل حضور الطلاب</h2>
    <a href="attendance-history.html" class="history-link">📜 عرض السجلات السابقة</a>
  </div>

  <div class="setup-card">
    <div class="form-group">
      <label>المادة الدراسية</label>
      <select id="subjectSelect">
        <option value="">اختر المادة</option>
      </select>
    </div>
    <div class="form-group">
      <label>التاريخ</label>
      <input type="date" id="attendanceDate">
    </div>
    <button class="btn-save-all" style="padding: 10px 20px; font-size: 14px;" onclick="loadStudents()">بدء التحضير</button>
  </div>

  <div id="attendanceList" class="attendance-list" style="display: none;">
    <!-- سيتم تحميل الطلاب هنا -->
  </div>

  <div class="footer-actions" id="footerActions" style="display: none;">
    <button class="btn-save-all" onclick="saveAttendance()">حفظ كشف الحضور النهائي</button>
  </div>
</div>

<script>
  const token = localStorage.getItem("token");
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  if (!token) location.href = "login.html";

  // تعيين تاريخ اليوم تلقائياً
  document.getElementById("attendanceDate").valueAsDate = new Date();

  let studentsData = [];
  let attendanceStatus = {}; // { studentId: 'present' | 'absent' }

  async function loadSubjects() {
    try {
      const res = await fetch("/api/subjects", {
        headers: { Authorization: "Bearer " + token }
      });
      const subjects = await res.json();
      const select = document.getElementById("subjectSelect");
      select.innerHTML += subjects.map(s => `<option value="${s._id}">${s.name}</option>`).join("");
    } catch (err) { 
      console.error("خطأ في تحميل المواد:", err);
      Swal.fire('خطأ', 'فشل تحميل قائمة المواد', 'error');
    }
  }

  async function loadStudents() {
    const subjectId = document.getElementById("subjectSelect").value;
    if (!subjectId) return Swal.fire('تنبيه', 'يرجى اختيار المادة أولاً', 'warning');

    Swal.fire({ 
      title: 'جاري تحميل قائمة الطلاب...', 
      didOpen: () => Swal.showLoading() 
    });

    try {
      const res = await fetch(`/api/attendance/students?subject=${subjectId}`, {
        headers: { Authorization: "Bearer " + token }
      });
      
      if (!res.ok) throw new Error('فشل تحميل الطلاب');
      
      studentsData = await res.json();
      attendanceStatus = {}; // إعادة تعيين حالة الحضور
      
      renderStudents();
      document.getElementById("attendanceList").style.display = "block";
      document.getElementById("footerActions").style.display = "flex";
      Swal.close();
    } catch (err) {
      Swal.fire('خطأ', 'فشل تحميل قائمة الطلاب', 'error');
    }
  }

  function renderStudents() {
    const list = document.getElementById("attendanceList");
    if (studentsData.length === 0) {
      list.innerHTML = '<div class="student-row"><div class="student-info"><span class="student-name">لا يوجد طلاب مسجلين في هذه المادة</span></div></div>';
      return;
    }
    
    list.innerHTML = studentsData.map(s => {
      const status = attendanceStatus[s._id] || 'absent';
      return `
        <div class="student-row ${status === 'present' ? 'row-present' : 'row-absent'}" id="row-${s._id}">
          <div class="student-info">
            <span class="student-name">${s.name}</span>
            <span class="student-email">${s.email || 'لا يوجد بريد إلكتروني'}</span>
          </div>
          <div class="attendance-actions">
            <button class="btn-status btn-present ${status === 'present' ? 'active' : ''}" 
                    onclick="setStatus('${s._id}', 'present')">حاضر</button>
            <button class="btn-status btn-absent ${status === 'absent' ? 'active' : ''}" 
                    onclick="setStatus('${s._id}', 'absent')">غائب</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function setStatus(studentId, status) {
    attendanceStatus[studentId] = status;
    const row = document.getElementById(`row-${studentId}`);
    const btns = row.querySelectorAll('.btn-status');
    
    row.classList.remove('row-present', 'row-absent');
    row.classList.add(status === 'present' ? 'row-present' : 'row-absent');
    
    btns[0].classList.toggle('active', status === 'present');
    btns[1].classList.toggle('active', status === 'absent');
  }

  async function saveAttendance() {
    const subject = document.getElementById("subjectSelect").value;
    const date = document.getElementById("attendanceDate").value;
    
    if (!subject) return Swal.fire('تنبيه', 'يرجى اختيار المادة أولاً', 'warning');
    if (!date) return Swal.fire('تنبيه', 'يرجى اختيار التاريخ أولاً', 'warning');
    
    const attendanceRecords = studentsData.map(s => ({
      student: s._id,
      status: attendanceStatus[s._id] || 'absent'
    }));

    Swal.fire({ 
      title: 'جاري الحفظ...', 
      didOpen: () => Swal.showLoading() 
    });

    try {
      const res = await fetch("/api/attendance", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          Authorization: "Bearer " + token 
        },
        body: JSON.stringify({ 
          subject, 
          date, 
          students: attendanceRecords 
        })
      });

      if (res.ok) {
        Swal.fire('تم بنجاح', 'تم حفظ كشف الحضور لهذا اليوم', 'success');
        // إعادة تعيين النموذج
        attendanceStatus = {};
        document.getElementById("attendanceList").innerHTML = '';
        document.getElementById("attendanceList").style.display = "none";
        document.getElementById("footerActions").style.display = "none";
      } else {
        const error = await res.json();
        throw new Error(error.message || 'حدث خطأ أثناء الحفظ');
      }
    } catch (err) {
      Swal.fire('خطأ', err.message || 'حدثت مشكلة أثناء الحفظ', 'error');
    }
  }

  loadSubjects();
  if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
</script>
</body>
</html>
