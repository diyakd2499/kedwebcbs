<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمة مرور جديدة | كلية تقنية المعلومات</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0d3b66, #1e6091);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      width: 900px;
      height: 500px;
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .left-side {
      flex: 1;
      background: #0d3b66;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .left-side img {
      width: 120px;
      margin-bottom: 20px;
    }

    .left-side h2 {
      margin: 0;
    }

    .left-side p {
      opacity: 0.9;
      margin-top: 10px;
      font-size: 14px;
    }

    .right-side {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .right-side h3 {
      margin-bottom: 20px;
      color: #0d3b66;
    }

    .right-side p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .right-side input {
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .right-side button {
      padding: 12px;
      background: #0d3b66;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .right-side button:hover {
      background: #092b4c;
      transform: translateY(-2px);
    }

    .right-side button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #0d3b66;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s;
    }

    .back-link a:hover {
      color: #1e6091;
      text-decoration: underline;
    }

    .error {
      margin-top: 10px;
      color: #d9534f;
      font-size: 14px;
      padding: 10px;
      background: #fff1f1;
      border-radius: 6px;
      border-right: 4px solid #d9534f;
      display: none;
    }

    .success {
      margin-top: 10px;
      color: #28a745;
      font-size: 14px;
      padding: 10px;
      background: #f0fff4;
      border-radius: 6px;
      border-right: 4px solid #28a745;
      display: none;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .password-strength {
      font-size: 12px;
      margin-bottom: 15px;
      display: none;
    }

    .password-strength.weak {
      color: #d9534f;
    }

    .password-strength.medium {
      color: #f0ad4e;
    }

    .password-strength.strong {
      color: #28a745;
    }

    .main-footer {
      margin-top: 25px;
      font-size: 13px;
      color: #e0e0e0;
      text-align: center;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        width: 90%;
        height: auto;
      }
      
      .left-side, .right-side {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="left-side">
    <img src="assets/logo.png">
    <h2>كلية تقنية المعلومات</h2>
    <p>جامعة النصر التقنية<br>تعيين كلمة مرور جديدة</p>
  </div>

  <div class="right-side">
    <h3>كلمة مرور جديدة</h3>
    
    <p>أدخل كلمة المرور الجديدة. يجب أن تكون 6 أحرف على الأقل.</p>
    
    <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
    <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور الجديدة">
    
    <div class="password-strength" id="passwordStrength"></div>
    
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    
    <button onclick="resetPassword()" id="submitBtn">
      <span id="btnText">تعيين كلمة المرور الجديدة</span>
      <span class="loading" id="loading" style="display: none;"></span>
    </button>
    
    <div class="back-link">
      <a href="login.html">العودة إلى تسجيل الدخول</a>
    </div>
  </div>
</div>

<footer class="main-footer">
  إنشاء: <strong>ضياء الدين إبراهيم</strong> —  
  حقوق النشر © <span id="year"></span> جامعة النصر التقنية
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();

  // الحصول على التوكن المؤقت من الرابط
  const urlParams = new URLSearchParams(window.location.search);
  const tempToken = urlParams.get('tempToken');
  
  if (!tempToken) {
    window.location.href = "forgot-password.html";
  }

  const newPasswordInput = document.getElementById('newPassword');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const passwordStrengthEl = document.getElementById('passwordStrength');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');

  // التحقق من قوة كلمة المرور
  newPasswordInput.addEventListener('input', function() {
    const password = this.value;
    
    if (password.length === 0) {
      passwordStrengthEl.style.display = 'none';
      return;
    }
    
    let strength = '';
    let strengthClass = '';
    
    if (password.length < 6) {
      strength = 'ضعيفة جداً';
      strengthClass = 'weak';
    } else if (password.length < 8) {
      strength = 'ضعيفة';
      strengthClass = 'weak';
    } else if (password.length < 10) {
      strength = 'متوسطة';
      strengthClass = 'medium';
    } else if (/[A-Z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) {
      strength = 'قوية جداً';
      strengthClass = 'strong';
    } else if (/[A-Z]/.test(password) || /[0-9]/.test(password)) {
      strength = 'جيدة';
      strengthClass = 'medium';
    } else {
      strength = 'ضعيفة';
      strengthClass = 'weak';
    }
    
    passwordStrengthEl.textContent = `قوة كلمة المرور: ${strength}`;
    passwordStrengthEl.className = `password-strength ${strengthClass}`;
    passwordStrengthEl.style.display = 'block';
  });

  // التحقق من تطابق كلمتي المرور
  confirmPasswordInput.addEventListener('input', function() {
    const newPassword = newPasswordInput.value;
    const confirmPassword = this.value;
    
    if (confirmPassword.length === 0) return;
    
    if (newPassword !== confirmPassword) {
      errorEl.textContent = "كلمتا المرور غير متطابقتين";
      errorEl.style.display = 'block';
      submitBtn.disabled = true;
    } else {
      errorEl.style.display = 'none';
      submitBtn.disabled = false;
    }
  });

  async function resetPassword() {
    const newPassword = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;
    
    // إخفاء الرسائل السابقة
    errorEl.style.display = "none";
    successEl.style.display = "none";
    
    // التحقق من البيانات
    if (!newPassword || !confirmPassword) {
      showError("الرجاء إدخال جميع الحقول");
      return;
    }
    
    // التحقق من تطابق كلمتي المرور
    if (newPassword !== confirmPassword) {
      showError("كلمتا المرور غير متطابقتين");
      return;
    }
    
    // التحقق من قوة كلمة المرور
    if (newPassword.length < 6) {
      showError("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
      return;
    }
    
    // عرض حالة التحميل
    submitBtn.disabled = true;
    btnText.textContent = "جاري تعيين كلمة المرور...";
    loading.style.display = "inline-block";
    
    try {
      const response = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ 
          tempToken, 
          newPassword, 
          confirmPassword 
        })
      });
      
      const data = await response.json();
      
      // إعادة تعيين الزر
      submitBtn.disabled = false;
      btnText.textContent = "تعيين كلمة المرور الجديدة";
      loading.style.display = "none";
      
      if (!response.ok) {
        showError(data.message || "حدث خطأ أثناء تعيين كلمة المرور");
        return;
      }
      
      // نجاح إعادة التعيين
      showSuccess("تم تعيين كلمة المرور الجديدة بنجاح!");
      
      // توجيه إلى صفحة تسجيل الدخول بعد 3 ثواني
      setTimeout(() => {
        window.location.href = "login.html";
      }, 3000);
      
    } catch (error) {
      console.error("Reset password error:", error);
      
      // إعادة تعيين الزر
      submitBtn.disabled = false;
      btnText.textContent = "تعيين كلمة المرور الجديدة";
      loading.style.display = "none";
      
      showError("حدث خطأ في الاتصال بالخادم");
    }
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = "block";
  }

  function showSuccess(message) {
    successEl.textContent = message;
    successEl.style.display = "block";
  }
</script>

</body>
</html>
