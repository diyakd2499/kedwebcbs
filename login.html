<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | كلية تقنية المعلومات</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-light: #f8fafc;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      transition: all 0.2s ease;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: white;
    }

    /* ===== Layout ===== */
    .login-wrapper {
      width: 100%;
      display: flex;
    }

    /* Right Side (Form) */
    .form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 8%;
      background: white;
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Left Side (Brand) */
    .brand-side {
      flex: 1.2;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 40px;
      /* Pattern Overlay */
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* ===== Brand Elements ===== */
    .brand-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
      background: white;
      border-radius: 50%;
      padding: 10px;
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-top: 15px;
      font-weight: 300;
      max-width: 400px;
    }

    /* ===== Form Elements ===== */
    .header-text h2 {
      font-size: 2rem;
      color: var(--text-main);
      margin: 0 0 10px 0;
      font-weight: 700;
    }

    .header-text p {
      color: var(--text-muted);
      margin: 0 0 30px 0;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .icon-start { right: 15px; }
    .icon-end { left: 15px; cursor: pointer; }

    .form-control {
      width: 100%;
      padding: 14px 45px 14px 15px; /* مساحة للأيقونة يمين */
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      color: var(--text-main);
      background: var(--bg-light);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    /* زر الدخول */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }

    .btn-login:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    /* Links */
    .forgot-pass {
      display: block;
      text-align: left; /* تغيير الاتجاه لليسار */
      margin-top: 15px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .forgot-pass:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    /* Alerts */
    .alert {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-success { background: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; }
    .alert-warning { background: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }

    /* Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer inside Form */
    .form-footer {
      margin-top: auto;
      padding-top: 30px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .brand-side { display: none; }
      .form-side { padding: 40px 20px; max-width: 100%; }
      body { background: white; }
    }
  </style>
</head>

<body>

<div class="login-wrapper">
  
  <div class="form-side">
    <div class="header-text">
      <h2>تسجيل الدخول 👋</h2>
      <p>أهلاً بك مجدداً، الرجاء إدخال بيانات حسابك.</p>
    </div>

    <div class="alert alert-danger" id="error"></div>
    <div class="alert alert-success" id="success"></div>
    <div class="alert alert-warning" id="lockWarning"></div>

    <form onsubmit="event.preventDefault(); login();">
      
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <div class="input-wrapper">
          <i class="ri-mail-line icon-start"></i>
          <input type="email" id="email" class="form-control" placeholder="example@nun.edu.sd" required>
        </div>
      </div>

      <div class="input-group">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <i class="ri-lock-password-line icon-start"></i>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          <i class="ri-eye-off-line icon-end" id="togglePass" onclick="togglePasswordVisibility()"></i>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="spinner" id="loginLoading"></span>
        <span id="loginText">دخول</span>
      </button>

      <a href="forgot-password.html" class="forgot-pass">نسيت كلمة المرور؟</a>

    </form>

    <div class="form-footer">
      حقوق النشر © <span id="year"></span> جامعة النصر التقنية
    </div>
  </div>

  <div class="brand-side">
    <img src="assets/logo.png" class="brand-logo" alt="Logo">
    <h1 class="brand-title">كلية تقنية المعلومات</h1>
    <p class="brand-subtitle">نظام إدارة المحاضرات والعملية التعليمية<br>بوابة أعضاء هيئة التدريس والطلاب</p>
  </div>

</div>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();

  // ميزة إظهار/إخفاء كلمة المرور
  function togglePasswordVisibility() {
    const passInput = document.getElementById("password");
    const icon = document.getElementById("togglePass");
    
    if (passInput.type === "password") {
      passInput.type = "text";
      icon.classList.replace("ri-eye-off-line", "ri-eye-line");
    } else {
      passInput.type = "password";
      icon.classList.replace("ri-eye-line", "ri-eye-off-line");
    }
  }

  // التحقق من التوكن السابق
  const token = localStorage.getItem('token');
  if (token) {
    window.location.href = 'dashboard.html';
  }

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const loginBtn = document.getElementById("loginBtn");
    const loginText = document.getElementById("loginText");
    const loginLoading = document.getElementById("loginLoading");
    
    // إخفاء التنبيهات السابقة
    hideAlerts();
    
    if (!email || !password) {
      showAlert("error", "يرجى ملء جميع الحقول المطلوبة");
      return;
    }
    
    // حالة التحميل
    loginBtn.disabled = true;
    loginText.textContent = "جاري التحقق...";
    loginLoading.style.display = "block";
    
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      
      // إعادة الزر لوضعه الطبيعي
      loginBtn.disabled = false;
      loginText.textContent = "دخول";
      loginLoading.style.display = "none";
      
      if (!res.ok) {
        if (res.status === 423) {
          showAlert("lock", data.message || "الحساب مقفل مؤقتاً بسبب تكرار المحاولات");
        } else {
          let msg = data.message || "حدث خطأ غير معروف";
          if (data.remainingAttempts !== undefined) {
             msg += ` (المحاولات المتبقية: ${data.remainingAttempts})`;
          }
          showAlert("error", msg);
        }
        return;
      }

      // نجاح الدخول
      showAlert("success", "تم تسجيل الدخول بنجاح! جاري التوجيه...");
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));

      const user = data.user;
      
      setTimeout(() => {
        if (user.firstLogin) {
          window.location.href = "force-change-password.html"; // تأكد من وجود هذه الصفحة بنفس التصميم
        } else {
          // توجيه حسب الصلاحية
          if (user.roles.includes("dean")) {
            window.location.href = "admin_dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        }
      }, 1500);
      
    } catch (err) {
      console.error("Login error:", err);
      loginBtn.disabled = false;
      loginText.textContent = "دخول";
      loginLoading.style.display = "none";
      showAlert("error", "فشل الاتصال بالخادم، يرجى التحقق من الإنترنت");
    }
  }

  function showAlert(type, message) {
    let el;
    let icon = "";
    
    if (type === "error") {
      el = document.getElementById("error");
      icon = '<i class="ri-error-warning-fill"></i> ';
    } else if (type === "success") {
      el = document.getElementById("success");
      icon = '<i class="ri-checkbox-circle-fill"></i> ';
    } else if (type === "lock") {
      el = document.getElementById("lockWarning");
      icon = '<i class="ri-lock-2-fill"></i> ';
    }
    
    if (el) {
      el.innerHTML = icon + message;
      el.style.display = "flex";
      // هزة خفيفة للحقل في حالة الخطأ
      if(type === 'error') {
         document.querySelector('.form-side').animate([
           { transform: 'translateX(0)' }, 
           { transform: 'translateX(-5px)' }, 
           { transform: 'translateX(5px)' }, 
           { transform: 'translateX(0)' }
         ], { duration: 300 });
      }
    }
  }

  function hideAlerts() {
    document.getElementById("error").style.display = "none";
    document.getElementById("success").style.display = "none";
    document.getElementById("lockWarning").style.display = "none";
  }
</script>

</body>
</html>
