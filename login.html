<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | كلية تقنية المعلومات</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0d3b66, #1e6091);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: white;
      width: 900px;
      height: 500px;
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .login-left {
      flex: 1;
      background: #0d3b66;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .login-left img {
      width: 120px;
      margin-bottom: 20px;
    }

    .login-left h2 {
      margin: 0;
    }

    .login-left p {
      opacity: 0.9;
      margin-top: 10px;
      font-size: 14px;
    }

    .login-right {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right h3 {
      margin-bottom: 20px;
      color: #0d3b66;
    }

    .login-right input {
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .login-right button {
      padding: 12px;
      background: #0d3b66;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .login-right button:hover {
      background: #092b4c;
    }

    .error {
      margin-top: 10px;
      color: red;
      font-size: 14px;
    }

    .main-footer {
      margin-top: 25px;
      font-size: 13px;
      color: #e0e0e0;
      text-align: center;
    }

    @media (max-width: 900px) {
      .login-container {
        flex-direction: column;
        width: 90%;
        height: auto;
      }
    }
  </style>
</head>


<body>

<!-- ===== Header ===== -->
<header class="main-header">
  <div class="header-left">
    <img src="assets/logo.png" class="logo">
    <div class="header-title">
      <strong>كلية تقنية المعلومات</strong><br>
      <small>جامعة النصر التقنية</small>
    </div>
  </div>

  <div class="header-actions">
    <button class="btn" onclick="toggleDark()">🌙</button>
    <button class="btn" onclick="logout()">خروج</button>
  </div>
</header>

<!-- ===== Content ===== -->
<div class="container">

  <div class="welcome" id="welcome"></div>

  <div class="grid" id="dashboard">
    <!-- المواد -->
    <div class="card" onclick="go('subjects.html')">
      <div class="icon">📚</div>
      <div class="card-title">المواد الدراسية</div>
    </div>

    <!-- التنبيهات -->
    <div class="card" onclick="go('notifications.html')">
      <div class="icon">🔔</div>
      <div class="card-title">التنبيهات</div>
      <span class="badge" id="notifBadge">0</span>
    </div>
  </div>

</div>

<div id="toast-container"></div>

<footer class="main-footer">
  إنشاء: <strong>ضياء الدين إبراهيم</strong> —  
  حقوق النشر © <span id="year"></span> جامعة النصر التقنية
</footer>

<script>
  document.getElementById("year").innerText = new Date().getFullYear();

  const token = localStorage.getItem("token");
  const user = JSON.parse(localStorage.getItem("user") || "{}");

  if (!token || !user.name) {
    window.location.href = "login.html";
  }

  document.getElementById("welcome").innerText = "مرحبًا، " + user.name + " 👋";

  const dash = document.getElementById("dashboard");

  // إضافة خيارات إضافية بناءً على الدور
  if (user.roles.includes("leader") || user.roles.includes("doctor")) {
    dash.innerHTML += `
      <div class="card" onclick="go('manage-lectures.html')">
        <div class="icon">🎓</div>
        <div class="card-title">إدارة المحاضرات</div>
      </div>
      
      <!-- إدارة التنبيهات للدكتور والليدر -->
      <div class="card" onclick="go('manage-notifications.html')">
        <div class="icon">📋</div>
        <div class="card-title">إدارة التنبيهات</div>
      </div>
    `;
    
    // تسجيل الحضور متاح للدكتور والعميد فقط كما طلب المستخدم
    if (user.roles.includes("doctor") || user.roles.includes("dean")) {
      dash.innerHTML += `
        <div class="card" onclick="go('manage-attendance.html')">
          <div class="icon">📝</div>
          <div class="card-title">تسجيل حضور الطلاب</div>
        </div>
      `;
    }
  }

  if (user.roles.includes("dean")) {
    dash.innerHTML += `
      <div class="card admin" onclick="go('admin_dashboard.html')">
        <div class="icon">🛠️</div>
        <div class="card-title">لوحة تحكم الإدارة</div>
      </div>
    `;
  }

  function go(page) {
    window.location.href = page;
  }

  function logout() {
    localStorage.clear();
    window.location.href = "login.html";
  }

  /* ===== Notifications Count & Toast ===== */
  async function checkNotifications() {
    try {
      const res = await fetch("/api/notifications", {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await res.json();
      
      // تحديث العداد (غير المقروء)
      const unreadCountRes = await fetch("/api/notifications/unread-count", {
        headers: { Authorization: "Bearer " + token }
      });
      const { count } = await unreadCountRes.json();
      
      const badge = document.getElementById("notifBadge");
      if (count > 0) {
        badge.innerText = count;
        badge.style.display = "block";
      } else {
        badge.style.display = "none";
      }

      // حل مشكلة التكرار: تخزين معرفات الإشعارات المعروضة
      const shownNotifications = JSON.parse(localStorage.getItem("shownNotifications") || "[]");
      const lastCheckTime = localStorage.getItem("lastNotifCheck") || 0;
      
      // تصفية الإشعارات الطارئة الجديدة التي لم تظهر بعد
      const newEmergency = data.filter(n => 
        n.type === "emergency" && 
        !shownNotifications.includes(n._id) &&
        new Date(n.createdAt).getTime() > lastCheckTime
      );

      if (newEmergency.length > 0) {
        newEmergency.forEach(n => {
          showToast(n);
          // إضافة معرف الإشعار إلى القائمة لمنع التكرار
          shownNotifications.push(n._id);
        });
        localStorage.setItem("shownNotifications", JSON.stringify(shownNotifications));
        localStorage.setItem("lastNotifCheck", Date.now());
      }
    } catch (err) {
      console.error("Error checking notifications:", err);
    }
  }

  function showToast(n) {
    const container = document.getElementById("toast-container");
    
    // التحقق من عدم وجود toast بنفس المعرف
    if (document.querySelector(`[data-notif-id="${n._id}"]`)) {
      return;
    }
    
    const toast = document.createElement("div");
    toast.className = `toast ${n.type === "emergency" ? "emergency" : ""}`;
    toast.setAttribute("data-notif-id", n._id);
    toast.innerHTML = `
      <div class="icon">${n.type === "emergency" ? "🚨" : "🔔"}</div>
      <div class="toast-content">
        <div class="toast-title">${n.title}</div>
        <div class="toast-message">${n.message.substring(0, 50)}${n.message.length > 50 ? '...' : ''}</div>
        <div style="font-size:11px; color:#666; margin-top:3px;">
          ${new Date(n.createdAt).toLocaleTimeString('ar-EG')}
        </div>
      </div>
    `;
    toast.onclick = () => {
      window.location.href = "notifications.html";
    };
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = "0";
      setTimeout(() => {
        toast.remove();
        // إزالة المعرف من localStorage بعد إزالة الـ toast
        const shownNotifications = JSON.parse(localStorage.getItem("shownNotifications") || "[]");
        const index = shownNotifications.indexOf(n._id);
        if (index > -1) {
          shownNotifications.splice(index, 1);
          localStorage.setItem("shownNotifications", JSON.stringify(shownNotifications));
        }
      }, 500);
    }, 8000);
  }

  // فحص التنبيهات عند التحميل وكل دقيقة
  checkNotifications();
  setInterval(checkNotifications, 60000);

  /* ===== Dark Mode ===== */
  function toggleDark() {
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
  }

  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
  }
</script>

</body>
</html>
