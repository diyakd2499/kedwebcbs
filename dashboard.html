<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | كلية تقنية المعلومات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0d3b66;
      --secondary: #1e6091;
      --accent: #d9534f;
      --bg-light: #f8fafc;
      --card-light: #ffffff;
      --text-light: #334155;
      
      /* Dark Mode Colors */
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --text-dark: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      transition: background-color 0.3s, color 0.3s, transform 0.2s;
    }

    body {
      margin: 0;
      background: var(--bg-light);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.dark {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    /* ===== Header Modern Design ===== */
    .main-header {
      background: var(--primary);
      color: white;
      padding: 12px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 50px;
      height: 50px;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
    }

    .header-title strong {
      font-size: 18px;
      display: block;
      line-height: 1.2;
    }

    .header-title small {
      font-size: 13px;
      opacity: 0.8;
      font-weight: 300;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* ===== Main Layout ===== */
    .container {
      padding: 40px 5%;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .welcome {
      font-size: 26px;
      margin-bottom: 30px;
      color: var(--primary);
      font-weight: 700;
      border-right: 5px solid var(--accent);
      padding-right: 15px;
    }

    body.dark .welcome {
      color: #90caf9;
    }

    /* ===== Dashboard Grid ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    /* ===== Professional Cards ===== */
    .card {
      background: var(--card-light);
      padding: 30px;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 15px;
      position: relative;
      overflow: hidden;
    }

    body.dark .card {
      background: var(--card-dark);
      border-color: rgba(255,255,255,0.05);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }

    /* إضافة تأثير توهج خلف الأيقونة */
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(13,59,102,0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      border-color: var(--primary);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    body.dark .card-title {
      color: #cbd5e1;
    }

    .admin {
      border-bottom: 5px solid var(--accent);
    }

    /* ===== Notification Badge ===== */
    .badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--accent);
      color: white;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(217, 83, 79, 0.4);
    }

    /* ===== Toasts ===== */
    #toast-container {
      position: fixed;
      bottom: 30px;
      left: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .toast {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      border-right: 6px solid var(--primary);
      width: 350px;
      animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    body.dark .toast {
      background: rgba(30, 41, 59, 0.9);
      color: white;
    }

    @keyframes slideIn {
      from { transform: translateX(-120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ===== Footer ===== */
    .main-footer {
      margin-top: auto;
      padding: 30px;
      text-align: center;
      font-size: 14px;
      background: rgba(0,0,0,0.02);
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    body.dark .main-footer {
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* ===== Mobile Responsive ===== */
    @media (max-width: 768px) {
      .container { padding: 20px; }
      .welcome { font-size: 20px; }
      .main-header { padding: 10px 15px; }
      .header-title strong { font-size: 14px; }
      .grid { grid-template-columns: 1fr; }
      .card { flex-direction: row; text-align: right; padding: 20px; }
      .icon { font-size: 35px; margin: 0; }
    }
  </style>
</head>

<body>

<header class="main-header">
  <div class="header-left">
    <img src="assets/logo.png" class="logo" alt="شعار الكلية">
    <div class="header-title">
      <strong>كلية تقنية المعلومات</strong>
      <small>جامعة النصر التقنية</small>
    </div>
  </div>

  <div class="header-actions">
    <button class="btn" onclick="toggleDark()" title="تبديل الوضع">🌓</button>
    <button class="btn" onclick="logout()" style="background: var(--accent); border: none;">🚪 خروج</button>
  </div>
</header>

<div class="container">
  <div class="welcome" id="welcome">جارِ التحميل...</div>

  <div class="grid" id="dashboard">
    <div class="card" onclick="go('subjects.html')">
      <div class="icon">📚</div>
      <div class="card-title">المواد الدراسية</div>
    </div>

    <div class="card" onclick="go('notifications.html')">
      <div class="icon">🔔</div>
      <div class="card-title">التنبيهات</div>
      <span class="badge" id="notifBadge">0</span>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<footer class="main-footer">
  إنشاء: <strong>ضياء الدين إبراهيم</strong> —  
  حقوق النشر © <span id="year"></span> جامعة النصر التقنية
</footer>

<script>
    
  document.getElementById("year").innerText = new Date().getFullYear();

  const token = localStorage.getItem("token");
  const user = JSON.parse(localStorage.getItem("user") || "{}");

  // التحقق من التوكن والمستخدم
  if (!token || !user.name) {
    window.location.href = "login.html";
  }

  // التحقق من صلاحية التوكن
  async function verifyToken() {
    try {
      // تم تغيير المسار إلى المسار الصحيح الموجود في auth.routes
      const response = await fetch('/api/auth/users', {
        headers: { Authorization: "Bearer " + token }
      });
      
      // إذا كان المستخدم ليس عميداً، سيعيد 403 وهذا طبيعي، المهم أن التوكن صالح (ليس 401)
      if (response.status === 401) {
        localStorage.clear();
        window.location.href = "login.html";
        return false;
      }
      return true;
    } catch (error) {
      console.error("Token verification failed:", error);
      return true; // لا نوجه لصفحة الدخول عند خطأ الشبكة
    }
  }

  // استدعاء التحقق عند تحميل الصفحة
  if (token) {
    verifyToken();
  }

  // التحقق من أول دخول أو ضرورة تغيير كلمة المرور
  if (user.firstLogin === true || user.mustChangePassword === true) {
    window.location.href = "change-password.html?firstLogin=true";
  }

  // إذا لم يكن هناك تحويل، نتابع تحميل الصفحة
  document.getElementById("welcome").innerText = "مرحبًا، " + user.name + " 👋";

  const dash = document.getElementById("dashboard");

  // إضافة خيارات إضافية بناءً على الدور
  if (user.roles && (user.roles.includes("leader") || user.roles.includes("doctor"))) {
    dash.innerHTML += `
      <div class="card" onclick="go('manage-lectures.html')">
        <div class="icon">🎓</div>
        <div class="card-title">إدارة المحاضرات</div>
      </div>
      
      <!-- إضافة بطاقة إدارة التنبيهات للدكتور والليدر -->
      <div class="card" onclick="go('manage-notifications.html')">
        <div class="icon">📋</div>
        <div class="card-title">إدارة التنبيهات</div>
      </div>
    `;
    
    // تسجيل الحضور متاح للدكتور والعميد فقط كما طلب المستخدم
    if (user.roles.includes("doctor") || user.roles.includes("dean")) {
      dash.innerHTML += `
        <div class="card" onclick="go('manage-attendance.html')">
          <div class="icon">📝</div>
          <div class="card-title">تسجيل حضور الطلاب</div>
        </div>
      `;
    }
  }

  if (user.roles && user.roles.includes("dean")) {
    dash.innerHTML += `
      <div class="card admin" onclick="go('admin_dashboard.html')">
        <div class="icon">🛠️</div>
        <div class="card-title">لوحة تحكم الإدارة</div>
      </div>
    `;
  }

  function go(page) {
    window.location.href = page;
  }

  function logout() {
    if (confirm("هل تريد تسجيل الخروج؟")) {
      localStorage.clear();
      window.location.href = "login.html";
    }
  }

  /* ===== حل مشكلة تكرار الإشعارات الطارئة ===== */
  let notificationCheckInterval;

  async function checkNotifications() {
    try {
      // تحديث عدد الإشعارات غير المقروءة
      const unreadCountRes = await fetch("/api/notifications/unread-count", {
        headers: { Authorization: "Bearer " + token }
      });
      
      if (unreadCountRes.ok) {
        const { count } = await unreadCountRes.json();
        const badge = document.getElementById("notifBadge");
        if (count > 0) {
          badge.innerText = count > 9 ? "9+" : count;
          badge.style.display = "block";
        } else {
          badge.style.display = "none";
        }
      }

      // التحقق من الإشعارات الطارئة الجديدة فقط (بدون تكرار)
      await checkEmergencyNotifications();
    } catch (err) {
      console.error("Error checking notifications:", err);
    }
  }

  async function checkEmergencyNotifications() {
    try {
      // استخدام النقطة الجديدة لمنع التكرار
      const lastCheckTime = parseInt(localStorage.getItem("lastEmergencyCheck") || "0");
      const res = await fetch(`/api/notifications/emergency/new?lastCheck=${lastCheckTime}`, {
        headers: { Authorization: "Bearer " + token }
      });
      
      if (res.ok) {
        const emergencies = await res.json();
        
        // الحصول على معرفات الإشعارات المعروضة مسبقاً
        const shownIds = JSON.parse(localStorage.getItem("shownEmergencyIds") || "[]");
        
        // عرض الإشعارات الطارئة الجديدة فقط
        for (const emergency of emergencies) {
          if (!shownIds.includes(emergency._id)) {
            showToast(emergency);
            shownIds.push(emergency._id);
          }
        }
        
        // حفظ معرفات الإشعارات المعروضة
        localStorage.setItem("shownEmergencyIds", JSON.stringify(shownIds));
        
        // تحديث وقت آخر فحص
        localStorage.setItem("lastEmergencyCheck", Date.now());
        
        // تنظيف القائمة القديمة (تحتفظ بآخر 50 إشعار فقط)
        if (shownIds.length > 50) {
          localStorage.setItem("shownEmergencyIds", JSON.stringify(shownIds.slice(-50)));
        }
      }
    } catch (err) {
      console.error("Error checking emergency notifications:", err);
    }
  }

  function showToast(notification) {
    const container = document.getElementById("toast-container");
    
    // التحقق من عدم وجود toast بنفس المعرف
    if (document.querySelector(`[data-notif-id="${notification._id}"]`)) {
      return;
    }
    
    // معلومات المرسل
    const senderName = notification.createdBy?.name || "النظام";
    const roleName = notification.createdBy?.roleName || 
                    (notification.createdBy?.roles?.[0] === "dean" ? "العميد" :
                     notification.createdBy?.roles?.[0] === "doctor" ? "الدكتور" :
                     notification.createdBy?.roles?.[0] === "leader" ? "الليدر" : "النظام");
    
    const toast = document.createElement("div");
    toast.className = `toast ${notification.type === "emergency" ? "emergency" : ""}`;
    toast.setAttribute("data-notif-id", notification._id);
    
    toast.innerHTML = `
      <div class="icon">${notification.type === "emergency" ? "🚨" : "🔔"}</div>
      <div class="toast-content">
        <div class="toast-title">${notification.title}</div>
        <div class="toast-message">${notification.message.substring(0, 60)}${notification.message.length > 60 ? '...' : ''}</div>
        <div class="toast-sender">
          ${roleName} ${senderName} • ${new Date(notification.createdAt).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}
        </div>
      </div>
    `;
    
    toast.onclick = () => {
      // تسجيل الإشعار كمقروء عند النقر عليه
      markNotificationAsRead(notification._id);
      window.location.href = "notifications.html";
    };
    
    container.appendChild(toast);

    // إزالة الـ toast بعد 8 ثواني
    setTimeout(() => {
      toast.style.animation = "fadeOut 0.5s";
      setTimeout(() => {
        if (toast.parentNode) {
          toast.remove();
        }
      }, 500);
    }, 8000);
    
    // الحد الأقصى 3 توست في نفس الوقت
    const toasts = container.querySelectorAll('.toast');
    if (toasts.length > 3) {
      toasts[0].remove();
    }
  }

  async function markNotificationAsRead(notificationId) {
    try {
      await fetch(`/api/notifications/read/${notificationId}`, {
        method: "POST",
        headers: { Authorization: "Bearer " + token }
      });
    } catch (err) {
      console.error("Error marking notification as read:", err);
    }
  }

  // فحص صلاحية التوكن أولاً
  verifyToken().then(isValid => {
    if (isValid) {
      // فحص التنبيهات عند التحميل
      checkNotifications();
      
      // بدء الفحص الدوري كل دقيقة
      notificationCheckInterval = setInterval(checkNotifications, 60000);
    }
  });
  
  // تنظيف الفاصل الزمني عند مغادرة الصفحة
  window.addEventListener('beforeunload', () => {
    if (notificationCheckInterval) {
      clearInterval(notificationCheckInterval);
    }
  });

  /* ===== Dark Mode ===== */
  function toggleDark() {
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
  }

  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
  }
</script>

</body>
</html>
